<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同羽 · Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dance.css?v=21">
  <link rel="stylesheet" href="/css/social.css?v=12">
  <script>window.__BLOG_MEDIA_V='20250617-birds-v1';window.__BLOG_APP_V='1';</script>
</head>
<body class="booting">

  <div id="boot-screen" class="boot-screen">
    <canvas id="boot-clock" class="boot-clock" aria-hidden="true"></canvas>
  </div>

  <div id="party-layer" aria-hidden="true"></div>

  <div id="screen-stage" class="screen screen-stage">
    <div class="stage">
      <div class="title-block">
        <button id="play-btn" class="play-btn" type="button" aria-label="播放视频">
          <span class="play-icon">▶</span>
          <span class="play-label">播放</span>
        </button>
      </div>
    </div>

    <div class="music-controls" id="music-controls">
      <div class="stage-links">
        <a href="/blog" class="enter-blog-btn">进入博客 →</a>
        <a href="/resume" class="enter-blog-btn resume-btn">📄 我的简历</a>
      </div>
    </div>

    <p id="music-hint" class="enter-hint">点击 ▶ 让代码跳起来 · 连按空格有彩蛋 · 点红色 bug 除虫</p>

    <a class="scroll-down" href="#screen-hub" aria-label="下滑到留言板"><span class="scroll-down-arrow">⌄</span><span class="scroll-down-label">留言板</span></a>

    <div class="beat-bar">
      <div class="beat-dot" style="height:12px"></div>
      <div class="beat-dot" style="height:20px"></div>
      <div class="beat-dot" style="height:28px"></div>
      <div class="beat-dot" style="height:20px"></div>
      <div class="beat-dot" style="height:12px"></div>
      <div class="beat-dot" style="height:24px"></div>
      <div class="beat-dot" style="height:16px"></div>
      <div class="beat-dot" style="height:32px"></div>
    </div>
  </div>

  <section id="screen-hub" class="screen screen-hub">
    <div class="hub-card">
      <div class="hub-actions">
        <a id="download-btn" class="download-btn" href="/downloads/flymusic.apk" download="flymusic.apk" aria-label="下载空中钢琴 App">
          <span class="download-icon">⬇</span>
          <span class="download-label">空中钢琴 App</span>
        </a>
        <a href="/blog" class="enter-blog-btn hub-blog-btn">进入博客 →</a>
      </div>

      <div class="gb-board">
        <h3>💬 留言板</h3>

        <div id="gb-list" class="gb-list">
          <p class="gb-empty">加载留言中...</p>
        </div>

        <form id="message-form" class="message-form">
          <div class="gb-form-row">
            <input id="msg-nickname" type="text" maxlength="12" placeholder="昵称" required>
          </div>
          <div class="gb-form-row">
            <input id="msg-content" type="text" maxlength="40" placeholder="说点什么...（可只发图片或语音）">
          </div>
          <div class="gb-form-row gb-actions">
            <input id="gb-image-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
            <button type="button" id="gb-image-btn" class="gb-tool" title="发图片">📷</button>
            <button type="button" id="gb-voice-btn" class="gb-tool" title="录语音">🎤</button>
            <span id="gb-voice-status" class="gb-voice-status"></span>
            <button type="submit" class="gb-send">发送</button>
          </div>
          <div id="gb-attachments" class="gb-attachments" hidden>
            <span id="gb-image-preview" class="gb-attach-chip"></span>
            <span id="gb-voice-preview" class="gb-attach-chip"></span>
          </div>
        </form>
      </div>
    </div>
  </section>

  <canvas id="code-rain"></canvas>
  <div id="video-compare" aria-hidden="true">
    <canvas id="compare-original"></canvas>
    <div id="compare-handle">
      <span class="compare-grip">⟷</span>
    </div>
    <span class="compare-tag compare-tag-left">解析画面</span>
    <span class="compare-tag compare-tag-right">原视频</span>
  </div>
  <video id="ascii-video-source" class="ascii-video-source" muted loop playsinline preload="auto" aria-hidden="true">
    <source src="/video/ascii.mp4?v=20250617-birds-v1" type="video/mp4">
  </video>
  <div id="bug-hunt-layer" aria-hidden="true"></div>
  <div class="scanlines"></div>


  <div id="media-loader" class="media-loader" aria-live="polite" aria-busy="false">
    <div class="media-loader-box">
      <p id="media-loader-label" class="media-loader-label">正在下载视频信号...</p>
      <div class="media-loader-track">
        <div id="media-loader-fill" class="media-loader-fill"></div>
      </div>
      <p id="media-loader-pct" class="media-loader-pct">0%</p>
    </div>
  </div>

<script src="/js/media-url.js?v=4"></script>
  <script src="/js/music.js?v=12"></script>
  <script src="/js/boot.js?v=11"></script>
  <script src="/js/reverse-clock.js?v=1"></script>
  <script>
    (function () {
      var c = document.getElementById('boot-clock');
      if (c && window.ReverseClock) {
        var size = Math.min(window.innerWidth * 0.72, window.innerHeight * 0.6, 400);
        window.ReverseClock.init(c, size);
      }
    })();
  </script>
  <script src="/js/dancers.js?v=9"></script>
  <script src="/js/ascii-video.js?v=10"></script>
  <script src="/js/media-loader.js?v=9"></script>
  <script src="/js/dance.js?v=17"></script>
  <script src="/js/bug-hunt.js?v=9"></script>
  <script src="/js/shake.js?v=9"></script>
  <script src="/js/social.js?v=10"></script>
  <script src="/js/site-footer.js"></script>
</body>
</html>
